        :root {

            --text-primary: #e8e8e8;

            --accent: #4a9eff;
            --border: #2a2a2a;
        }

        body {

            background: var(--bg-primary);
            color: var(--text-primary);
            line-height: 1.6;
            overflow-x: hidden;
            position: relative;
        }

        /* Background Video */
        .video-background {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            overflow: hidden;
        }

        .video-background video {
            position: absolute;
            top: 50%;
            left: 50%;
            min-width: 100%;
            min-height: 100%;
            width: auto;
            height: auto;
            transform: translate(-50%, -50%);
            opacity: 0;
            transition: opacity 1.2s ease-in-out;
        }

        .video-background video.active {
            opacity: 0.99;
        }

        .video-background::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(to right, 
                rgba(10, 10, 10, 0.95) 0%, 
                rgba(10, 10, 10, 0.85) 30%,
                rgba(10, 10, 10, 0.7) 50%,
                rgba(10, 10, 10, 0.6) 100%);
            pointer-events: none;
        }

        .container {
            display: grid;
            grid-template-columns: 380px 1fr;
            min-height: 100vh;
            max-width: 1600px;
            margin: 0 auto;
            position: relative;
            z-index: 1;
        }

        /* Left Panel */
        .left-panel {
            background: rgba(26, 26, 26, 0.85);
            backdrop-filter: blur(10px);
            padding: 60px 40px;
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            position: relative;
        }

        .portrait-container {
            margin-bottom: 40px;
        }

        .portrait {
            width: 200px;
            height: 200px;
            border-radius: 50%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 72px;
            font-weight: 300;
            color: white;
            box-shadow: 0 8px 32px rgba(0,0,0,0.3);
        }

        .portrait img {
            width: 100%;
            border-radius: 50%;
        }

        .name {
            text-align: center;
            margin-top: 24px;
        }

        .name h1 {
            font-size: 28px;
            font-weight: 400;
            margin-bottom: 8px;
        }

        .name p {
            font-size: 14px;
            color: var(--text-secondary);
            font-weight: 300;
        }

        .greeting {
            margin: 40px 0 32px;
            font-size: 16px;
            color: var(--text-secondary);
            text-align: center;
            font-weight: 300;
        }

        .questions {
            flex: 1;
        }

        .question-item {
            padding: 16px 0;
            border-bottom: 1px solid var(--border);
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 15px;
            color: var(--text-secondary);
            font-weight: 300;
        }

        .question-item:hover {
            color: var(--accent);
            padding-left: 8px;
        }

        .question-item.active {
            color: var(--accent);
            font-weight: 400;
        }

        .language-toggle {
            margin-top: auto;
            padding-top: 32px;
            display: flex;
            justify-content: center;
            gap: 0.5em;
            font-size: 14px;
        }

        .lang-btn {
            background: none;
            border: none;
            color: var(--text-secondary);
            cursor: pointer;
            padding: 8px 16px;
            transition: color 0.3s ease;
            font-size: 14px;
        }

        .lang-btn:hover {
            color: var(--text-primary);
        }

        .lang-btn.active {
            color: var(--accent);
            font-weight: 500;
        }

        /* Right Panel */
        .right-panel {
            padding: 80px 100px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .response-container {
            max-width: 700px;
            width: 100%;
        }

        .response-content {
            opacity: 0;
            transform: translateY(20px);
            transition: all 0.6s ease;
        }

        .response-content.visible {
            opacity: 1;
            transform: translateY(0);
        }

        .response-title {
            font-size: 24px;
            font-weight: 400;
            margin-bottom: 32px;
            color: var(--text-primary);
            line-height: 1.4;
        }

        .response-text {

            line-height: 1.8;
            color: var(--text-secondary);
            font-weight: 300;
        }

            border-top: 1px solid var(--border);
            font-size: 15px;
            color: var(--text-secondary);
            font-weight: 300;

            font-weight: 400;
            color: var(--text-secondary);
            margin-bottom: 24px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .projects-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 24px;
        }

        .project-card {
            background: rgba(26, 26, 26, 0.9);
            backdrop-filter: blur(10px);
            border: 1px solid var(--border);
            border-radius: 8px;
            overflow: hidden;
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .project-card:hover {
            border-color: var(--accent);
            transform: translateY(-4px);
        }

            height: 160px;

            align-items: center;
            justify-content: center;
            font-size: 48px;

            padding: 20px;
        }

        .project-name {
            font-size: 18px;
            font-weight: 400;
            color: var(--text-primary);
            margin-bottom: 8px;
        }

        .project-description {
            font-size: 14px;
            line-height: 1.6;
            color: var(--text-secondary);
            margin-bottom: 16px;
        }

        .project-link {
            display: inline-block;
            font-size: 13px;
            color: var(--accent);
            text-decoration: none;
            font-weight: 400;
            transition: color 0.3s ease;
        }

        .project-link:hover {
            color: var(--text-primary);
        }

        .footer {
            position: fixed;
            bottom: 0;
            right: 0;
            padding: 24px 40px;
            display: flex;
            gap: 24px;
            font-size: 13px;
        }

        .footer a {
            color: var(--text-secondary);
            text-decoration: none;
            transition: color 0.3s ease;
        }

        .footer a:hover {
            color: var(--accent);
        }

        /* Loading Animation */
        .loading {
            display: inline-block;
            width: 4px;
            height: 4px;
            background: var(--accent);
            border-radius: 50%;
            animation: pulse 1.4s infinite ease-in-out;
        }

        @keyframes pulse {
            0%, 80%, 100% { opacity: 0.3; }
            40% { opacity: 1; }
        }

        /* Responsive */
        @media (max-width: 1200px) {
            .container {
                grid-template-columns: 320px 1fr;
            }

                padding: 60px 60px;
            }

            .container {

        }
    </style>
</head>

                        a: "La IA es poderosa, pero no es magia. He construido plataformas de IA para salud, inteligencia de clientes y automatización, y lo que he aprendido es esto: la IA amplifica cualquier sistema en el que la pongas. Si tu sistema es reflexivo y equitativo, la IA puede acelerar buenos resultados. Si es descuidado o extractivo, la IA escalará esos daños más rápido de lo que puedes arreglarlos. El trabajo real no está solo en los algoritmos — está en entender contexto, dinámicas de poder y consecuencias no intencionadas. Abordo la IA como ingeniero, sí, pero también como alguien que ha visto a la tecnología fallar a comunidades cuando se diseña sin ellas."
                    },
                    {
                        q: "¿Qué buscas en tu próximo rol o colaboración?",
                        a: "Me atraen organizaciones que piensan en sistemas, no en silos. Quiero trabajar con personas que están construyendo para el largo plazo — ya sea infraestructura, política o plataformas que reformulen cómo resolvemos problemas. Me importa el impacto que me sobreviva, trabajo que sea intelectualmente honesto, y equipos que valoren rigor y humanidad en igual medida. Me siento cómodo como fundador, líder técnico o asesor — lo que más importa es alineación en valores y ambición. Si estás construyendo algo que importa, y necesitas alguien que pueda ver todo el tablero, hablemos."
                    },
                    {
                        q: "¿Qué haces fuera de la tecnología?",
                        a: "Juego ajedrez — no competitivamente, pero en serio. Enseña paciencia, reconocimiento de patrones y la disciplina de pensar varios movimientos adelante. También he saltado de aviones más veces de las que probablemente debería admitir. El paracaidismo tiene una forma de aclarar lo que importa: preparación, presencia, y confiar en tu entrenamiento cuando todo se mueve rápido. Viajo seguido, por trabajo y curiosidad. Y paso tiempo en lugares donde la tecnología aún no ha llegado, o donde apenas está comenzando. Esos lugares me recuerdan por qué hago este trabajo."
                    }
                ]
            }
        };

        let currentLang = 'en';
        let activeQuestion = null;

        function renderQuestions() {
            const questionsContainer = document.getElementById('questions');
            questionsContainer.innerHTML = '';
            
            content[currentLang].questions.forEach((item, index) => {
                const questionDiv = document.createElement('div');
                questionDiv.className = 'question-item';
                questionDiv.textContent = item.q;
                questionDiv.onclick = () => showResponse(index);
                questionsContainer.appendChild(questionDiv);
            });
            
            document.getElementById('greeting').textContent = content[currentLang].greeting;
            document.getElementById('exploreMore').textContent = content[currentLang].exploreMore;
        }

        function showResponse(index) {
            const item = content[currentLang].questions[index];
            const responseContent = document.getElementById('responseContent');
            const responseTitle = document.getElementById('responseTitle');
            const responseText = document.getElementById('responseText');
            const exploreMore = document.getElementById('exploreMore');
            const relatedProjects = document.getElementById('relatedProjects');
            const projectsTitle = document.getElementById('projectsTitle');
            const projectsGrid = document.getElementById('projectsGrid');
            
            // Switch background video
            switchVideo(index);
            
            // Remove active state from all questions
            document.querySelectorAll('.question-item').forEach(q => q.classList.remove('active'));
            
            // Add active state to clicked question
            document.querySelectorAll('.question-item')[index].classList.add('active');
            
            // Fade out
            responseContent.classList.remove('visible');
            
            setTimeout(() => {
                responseTitle.textContent = item.q;
                responseText.innerHTML = `<p>${item.a}</p>`;
                
                // Show related projects
                const relatedProjectsList = projects[currentLang].projectsByQuestion[index];
                if (relatedProjectsList && relatedProjectsList.length > 0) {
                    projectsTitle.textContent = projects[currentLang].title;
                    projectsGrid.innerHTML = '';
                    
                    relatedProjectsList.forEach(project => {
                        const card = document.createElement('div');
                        card.className = 'project-card';
                        card.onclick = () => {
                            if (project.link !== '#') {
                                window.open(project.link, '_blank');
                            }
                        };
                        
                        card.innerHTML = `
                            <div class="project-image">${project.icon}</div>
                            <div class="project-content">
                                <div class="project-name">${project.name}</div>
                                <div class="project-description">${project.description}</div>
                                <a href="${project.link}" class="project-link" onclick="event.stopPropagation()">${currentLang === 'en' ? 'Learn more →' : 'Conoce más →'}</a>
                            </div>
                        `;
                        
                        projectsGrid.appendChild(card);
                    });
                    
                    relatedProjects.style.display = 'block';
                } else {
                    relatedProjects.style.display = 'none';
                }
                
                exploreMore.style.display = 'block';
                
                // Fade in
                setTimeout(() => {
                    responseContent.classList.add('visible');
                }, 50);
            }, 300);
            
            activeQuestion = index;
        }

        function switchVideo(index) {
            // Get all videos
            const videos = document.querySelectorAll('.video-background video');
            
            // Fade out all videos
            videos.forEach(video => {
                video.classList.remove('active');
                video.pause();
            });
            
            // Fade in and play the selected video
            const selectedVideo = document.getElementById(`video${index}`);
            if (selectedVideo) {
                selectedVideo.classList.add('active');
                selectedVideo.currentTime = 0;
                selectedVideo.play().catch(e => {
                    // Handle autoplay restrictions
                    console.log('Video autoplay prevented:', e);
                });
            }
        }

        // Language toggle
        document.querySelectorAll('.lang-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                const lang = this.dataset.lang;
                if (lang === currentLang) return;
                
                currentLang = lang;
                
                // Update active state
                document.querySelectorAll('.lang-btn').forEach(b => b.classList.remove('active'));
                this.classList.add('active');
                
                // Update HTML lang attribute
                document.documentElement.lang = lang;
                
                // Re-render questions
                renderQuestions();
                
                // If there was an active question, show its translation
                if (activeQuestion !== null) {
                    showResponse(activeQuestion);
                } else {
                    // Clear response area
                    const responseContent = document.getElementById('responseContent');
                    responseContent.classList.remove('visible');
                    document.getElementById('exploreMore').style.display = 'none';
                }
            });
        });

        // Initialize
        renderQuestions();
    </script>
</body>
</html>
