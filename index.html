<!DOCTYPE html>
<html lang="en">

<head>
    <!-- Basic -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pedro A. González — Technologist, Entrepreneur, Global Speaker</title>

    <!-- Primary SEO -->
    <meta name="description" content="Pedro A. González is a technologist, entrepreneur, and global speaker working at the intersection of software, AI, connectivity, and human-centered systems. Based in Cancún, Mexico." />
    <meta name="keywords" content="Pedro Gonzalez, technologist, software engineer, AI, digital nomad, global speaker, connectivity, Kaanbal, Internet Society, United Nations, Salzburg Global" />
    <meta name="author" content="Pedro A. González" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://pedroagont.com/" />

    <!-- Language / Geo -->
    <meta http-equiv="content-language" content="en" />
    <meta name="geo.region" content="MX-ROO" />
    <meta name="geo.placename" content="Cancún" />

    <!-- Open Graph (LinkedIn, Facebook, WhatsApp) -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Pedro A. González — Technologist & Global Innovator" />
    <meta property="og:description" content="Exploring technology, AI, connectivity, and human-centered systems across borders. Founder, educator, and global collaborator." />
    <meta property="og:url" content="https://pedroagont.com/" />
    <meta property="og:image" content="https://pedroagont.com/assets/preview-og.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Pedro A. González — Technologist & Global Innovator" />
    <meta name="twitter:description" content="Technology, AI, global collaboration, and human-centered systems. Based in Mexico, working worldwide." />
    <meta name="twitter:image" content="https://pedroagont.com/assets/preview-twitter.jpg" />

    <!-- Icons -->
    <link rel="icon" href="/assets/favicon.ico" />
    <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png" />

    <!-- Styles & Scripts -->
    <link rel="stylesheet" href="/assets/main.css">
    <script src="/assets/content.js" defer></script>
    <script src="/assets/script.js" defer></script>

    <!-- Structured Data (Person) -->
    <script type="application/ld+json">
    {
        "@context": "https://schema.org",
        "@type": "Person",
        "name": "Pedro A. González",
        "url": "https://pedroagont.com",
        "image": "https://pedroagont.com/portrait.jpg",
        "jobTitle": "Technologist, Entrepreneur, Speaker",
        "address": {
            "@type": "PostalAddress",
            "addressLocality": "Cancún",
            "addressCountry": "MX"
        },
        "sameAs": [
            "https://linkedin.com/in/pedroagont",
            "https://github.com/pedroagont"
        ]
    }
    </script>
</head>


<body>
    <!-- Background Video Container -->
    <div class="video-background">
        <video id="video0" muted loop playsinline>
            <source src="/assets/1.mp4"
                type="video/mp4">
        </video>
        <video id="video1" muted loop playsinline>
            <source src="/assets/2.mp4"
                type="video/mp4">
        </video>
        <video id="video2" muted loop playsinline>
            <source src="/assets/3.mp4"
                type="video/mp4">
        </video>
        <video id="video3" muted loop playsinline>
            <source src="/assets/4.mp4"
                type="video/mp4">
        </video>
        <video id="video4" muted loop playsinline>
            <source src="/assets/5.mp4"
                type="video/mp4">
        </video>
        <video id="video5" muted loop playsinline>
            <source src="/assets/6.mp4"
                type="video/mp4">
        </video>
    </div>

    <div class="container">
        <!-- Left Panel -->
        <div class="left-panel">
            <div class="portrait-container">
                <div class="portrait">
                    <img src="/assets/portrait.jpg" alt="Pedro A. González — technologist and global innovator">
                </div>
                <div class="name">
                    <h1>Pedro A. González</h1>
                    <p>Cancún, Mexico</p>
                </div>
            </div>

            <div class="greeting" id="greeting">
                Hello. What would you like to know?
            </div>

            <div class="questions" id="questions">
                <!-- Questions will be populated by JS -->
            </div>

            <div class="language-toggle">
                <button class="lang-btn active" data-lang="en">EN</button>
                <button class="lang-btn" data-lang="es">ES</button>
                <button class="lang-btn" data-lang="de">DE</button>
                <button class="lang-btn" data-lang="fr">FR</button>
            </div>
        </div>

        <!-- Right Panel -->
        <div class="right-panel">
            <div class="response-container">
                <div class="response-content" id="responseContent">
                    <div class="response-title" id="responseTitle"></div>
                    <div class="response-text" id="responseText"></div>
                    <div class="related-projects" id="relatedProjects" style="display: none;">
                        <h3 id="projectsTitle"></h3>
                        <div class="projects-grid" id="projectsGrid"></div>
                    </div>
                    <div class="explore-more" id="exploreMore" style="display: none;">
                        Would you like to explore something else?
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="footer">
        <a href="mailto:pgonzalez@post.com">Email</a>
        <a href="https://linkedin.com/in/pedroagont" target="_blank">LinkedIn</a>
        <a href="https://github.com/pedroagont" target="_blank">GitHub</a>
    </div>
</body>

</html>
